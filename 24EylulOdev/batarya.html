<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Batarya Şarj Süresi Hesaplama</title>
</head>
<body>
  <h1>Batarya Şarj Süresi Hesaplama</h1>

  <form id="sarjFormu">
    <label>Mevcut batarya yüzdesi:</label>
    <input type="number" id="mevcutYuzde" min="0" max="100" required>
    <br><br>

    <label>Hedef batarya yüzdesi:</label>
    <input type="number" id="hedefYuzde" min="0" max="100" required>
    <br><br>

    <label>Batarya kapasitesi (kWh):</label>
    <input type="number" id="bataryaKwh" min="0.1" step="0.1" required>
    <br><br>

    <label>İstasyon gücü (kW):</label>
    <input type="number" id="istasyonKw" min="0.1" step="0.1" required>
    <br><br>

    <button type="submit">Hesapla</button>
  </form>

  <h2 id="sonuc"></h2>

  <script>
    const form = document.getElementById("sarjFormu");
    const sonuc = document.getElementById("sonuc");

    form.addEventListener("submit", function (olay) {
      olay.preventDefault();

      const mevcutYuzde = Number(document.getElementById("mevcutYuzde").value);
      const hedefYuzde = Number(document.getElementById("hedefYuzde").value);
      const bataryaKwh = Number(document.getElementById("bataryaKwh").value);
      const istasyonKw = Number(document.getElementById("istasyonKw").value);

      if (mevcutYuzde > hedefYuzde) {
        sonuc.textContent =
          "Hata: Mevcut yüzde, hedef yüzdeden büyük. Batarya şarj edilemez.";
        return;
      }

      if (mevcutYuzde === hedefYuzde) {
        sonuc.textContent = "Batarya zaten hedef yüzdesinde. Şarj süresi: 0 dakika.";
        return;
      }

    
      const sarjEdilecekYuzde = hedefYuzde - mevcutYuzde;
   
      const gerekliEnerjiKwh = bataryaKwh * (sarjEdilecekYuzde / 100);

      const sarjSuresiSaat = gerekliEnerjiKwh / istasyonKw;

      const toplamDakika = Math.ceil(sarjSuresiSaat * 60);
      const saat = Math.floor(toplamDakika / 60);
      const dakika = toplamDakika % 60;

      sonuc.innerHTML = `
        Batarya kapasitesi: ${bataryaKwh} kWh<br>
        Gerekli enerji: ${gerekliEnerjiKwh.toFixed(2)} kWh<br>
        Tahmini şarj süresi: ${saat} saat ${dakika} dakika
      `;
    });
  </script>
</body>
</html>
