<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

      <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow',
                Arial, sans-serif;
            background: #e2e8f0;
            padding: 20px;
        }


        .chat-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: flex-end;

        }

        .avatar {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #10b981;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;

        }

        .message-content {
            background: white;
            padding: 12px 16px;
            border-radius: 16px 16px 16px 16px;
            max-width: 75%;
            box-shadow: 0 1px 3px rgba(0, 0, 0, 1);
        }

        .chat-row.outgoing {
            flex-direction: row-reverse;
        }

        .chat-row.outgoing .message-content {
            background: #10b981;
            color: aqua;
            border-radius: 16px 16px 16px 16px;
        }
    </style>
</head>
<body>
      <div class="chat-row">

        <div class="avatar">MK</div>
        <div class="message-content">
            <strong>Annem:</strong>
            <p>Arkadaşlar flexbox mantığını kavradıkmı?Bence zeynep mina
                tam olarak kavrayamadı gibi:)</p>
        </div>
    </div>

    <div class="chat-row outgoing">
        <div class="avatar" style="background: #10b981;">ZM</div>
        <div class="message-content">
            <p>anne ben anladım ya neden böyle diyorsun.Bende
                Html css artık yazabilirim gibi geliyor :p</p>
        </div>
    </div>

    
</body>            
</html>
